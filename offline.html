<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LEXO KURAN — Offline</title>
<meta name="theme-color" content="#fbfaf7">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="32x32">
<style>
  :root { color-scheme: light dark; --bg:#fbfaf7; --surface:#fff; --ink:#12171a; --ink-2:#4e5956;
          --line:#e4e0d8; --brand:#12664c; --brand-on:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1113; --surface:#171b1d; --ink:#e9edea; --ink-2:#a3ada9; --line:#252b2d;
            --brand:#4cc194; --brand-on:#04120d; }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100dvh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--ink); text-align: center;
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card { max-width: 22rem; display: grid; gap: 18px; justify-items: center; }
  h1 { font-size: 1.375rem; font-weight: 650; letter-spacing: -.02em; }
  p { color: var(--ink-2); line-height: 1.65; font-size: .9375rem; }
  ul { text-align: start; color: var(--ink-2); font-size: .875rem; line-height: 1.7;
       padding-inline-start: 20px; margin: 0; }
  a {
    display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 26px;
    border-radius: 999px; background: var(--brand); color: var(--brand-on);
    font-weight: 600; text-decoration: none; font-size: .9375rem;
  }
  .box { width: 100%; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
</style>
</head>
<body>
  <div class="card">
    <svg width="60" height="60" viewBox="0 0 100 100" aria-hidden="true">
      <defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#44C093"/><stop offset="1" stop-color="#18795A"/></linearGradient></defs>
      <rect width="100" height="100" rx="22" fill="#131819"/>
      <path d="M25 80V47.5C25 32.8 39.2 22.4 50 10.5c10.8 11.9 25 22.3 25 37v32.5z" fill="url(#a)"/>
      <path d="M48.7 56.6v17.9c-4.7-3.7-10.6-4.2-16.3-1.7a1.4 1.4 0 0 1-2-1.3V55.6c0-.6.3-1.1.9-1.3 5.9-2.3 12.2-1.6 16.9 1.4.3.2.5.5.5.9z" fill="#F7F4ED"/>
      <path d="M51.3 56.6v17.9c4.7-3.7 10.6-4.2 16.3-1.7a1.4 1.4 0 0 0 2-1.3V55.6c0-.6-.3-1.1-.9-1.3-5.9-2.3-12.2-1.6-16.9 1.4-.3.2-.5.5-.5.9z" fill="#F7F4ED"/>
      <rect x="49.1" y="54.2" width="1.8" height="21.4" rx=".9" fill="#E0B87E"/>
    </svg>

    <h1>Nuk ka lidhje me internetin</h1>
    <p>Aplikacioni nuk arriti të hapet nga memoria e pajisjes.</p>

    <div class="box">
      <ul>
        <li>Suret që ke hapur më parë punojnë offline.</li>
        <li>Favoritet dhe shënimet janë të ruajtura në pajisje.</li>
        <li>Recitimet e reja dhe tefsiri kërkojnë lidhje.</li>
      </ul>
    </div>

    <a href="./">Provo sërish</a>
  </div>
</body>
</html>
